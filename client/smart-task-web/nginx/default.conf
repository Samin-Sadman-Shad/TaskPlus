server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS. Resolving per request (variable in proxy_pass) means nginx starts even
    # if the API isn't up yet, and follows the API container when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: same origin for the browser. The API redirects plain HTTP to HTTPS, so call its HTTPS port
    # inside the private Docker network. Its certificate is the local dev certificate (CN=localhost),
    # so it is not verified on this internal hop.
    location /api/ {
        set $api_upstream https://api:8081;
        proxy_pass $api_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # Overwrite (never append): the client must not be able to choose its own IP.
        # No X-Forwarded-Proto: this hop is already HTTPS, which is what the API needs to see.
        proxy_set_header X-Forwarded-For $remote_addr;

        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # Liveness of the web container itself (used by the Docker HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build output: cache for a year.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Angular routes: fall back to index.html, never cached so a new build is picked up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
